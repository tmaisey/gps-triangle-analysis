svg.appendChild(el("line",{x1:bandL,y1:frame.y,x2:bandL,y2:frame.y+frame.h,stroke:"#eef0f1","stroke-width":1}));
// outer frame border (encloses data + wind band)
svg.appendChild(el("rect",{x:frame.x,y:frame.y,width:frame.w,height:frame.h,fill:"none",stroke:"#c9ccd0","stroke-width":1.2}));

// ---- traces (full-resolution, reduced opacity) -----------------------------
function trace(key,color){
  const pts=DATA.traces[key].map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  svg.appendChild(el("polyline",{points:pts,fill:"none",stroke:color,"stroke-width":1.1,
     "stroke-opacity":0.38,"stroke-linejoin":"round","stroke-linecap":"round"}));
}
trace("BILL","#86BC25");
trace("LEADER","#00A3E0");

// ---- start / finish line: perpendicular to base through start --------------
const dir=DATA.dir*Math.PI/180;
const pdir=dir+Math.PI/2;
const halfLine=95;
const sl1=[Math.sin(pdir)*halfLine, Math.cos(pdir)*halfLine];
const sl2=[-sl1[0],-sl1[1]];
svg.appendChild(el("line",{x1:X(sl1[0]),y1:Y(sl1[1]),x2:X(sl2[0]),y2:Y(sl2[1]),
   stroke:"#101820","stroke-width":1.6,"stroke-dasharray":"7 5","stroke-opacity":0.75}));

// ---- course triangle (bold ink, drawn last / on top) -----------------------
const o=DATA.order;
const tri=o.map(k=>X(DATA.course[k][0]).toFixed(1)+","+Y(DATA.course[k][1]).toFixed(1)).join(" ");
svg.appendChild(el("polygon",{points:tri,fill:"#101820","fill-opacity":0.04,
   stroke:"#101820","stroke-width":3.4,"stroke-linejoin":"round"}));
for(const k of o){
  const px=X(DATA.course[k][0]),py=Y(DATA.course[k][1]);
  svg.appendChild(el("circle",{cx:px,cy:py,r:4.5,fill:"#101820"}));
  svg.appendChild(el("circle",{cx:px,cy:py,r:4.5,fill:"none",stroke:"#fff","stroke-width":1.4}));
}
// start marker
svg.appendChild(el("circle",{cx:X(0),cy:Y(0),r:5.5,fill:"#fff",stroke:"#101820","stroke-width":2}));
svg.appendChild(el("circle",{cx:X(0),cy:Y(0),r:1.6,fill:"#101820"}));
const stTxt=el("text",{x:X(0)+9,y:Y(0)+14,"font-size":11.5,fill:"#101820","font-weight":600});
stTxt.textContent="START / FINISH"; svg.appendChild(stTxt);

// ---- North arrow (top-right of DATA area) ----------------------------------
(function(){
  const nx=data.x+data.w-30, ny=data.y+20;
  svg.appendChild(el("line",{x1:nx,y1:ny+34,x2:nx,y2:ny,stroke:"#101820","stroke-width":2}));
  svg.appendChild(el("polygon",{points:`${nx},${ny-2} ${nx-5},${ny+9} ${nx+5},${ny+9}`,fill:"#101820"}));
  const t=el("text",{x:nx,y:ny+50,"font-size":13,"font-weight":700,fill:"#101820","text-anchor":"middle"});
  t.textContent="N"; svg.appendChild(t);
})();

// ---- 100 m scale bar (bottom-left of DATA area) ----------------------------
(function(){
  const barM=100*s; const bx=data.x+18, by=data.y+data.h-20;
  svg.appendChild(el("line",{x1:bx,y1:by,x2:bx+barM,y2:by,stroke:"#101820","stroke-width":2.4}));
  svg.appendChild(el("line",{x1:bx,y1:by-5,x2:bx,y2:by+5,stroke:"#101820","stroke-width":2.4}));
  svg.appendChild(el("line",{x1:bx+barM,y1:by-5,x2:bx+barM,y2:by+5,stroke:"#101820","stroke-width":2.4}));
  const t=el("text",{x:bx,y:by-9,"font-size":12,fill:"#101820","font-weight":600});
  t.textContent="100 m"; svg.appendChild(t);
})();

// ---- legend (bottom-right of DATA area, evenly spaced) ----------------------
(function(){
  const by=data.y+data.h-20, rightEdge=data.x+data.w-16;
  const items=[["Bill","#86BC25"],["Leader","#00A3E0"],["Course","#101820"]];
  const charW=7.3, swatch=18, swGap=8, itemGap=28;
  const widths=items.map(([lab])=>swatch+swGap+lab.length*charW);
  const total=widths.reduce((a,b)=>a+b,0)+itemGap*(items.length-1);
  let x=rightEdge-total;
  items.forEach(([lab,col],i)=>{
    svg.appendChild(el("line",{x1:x,y1:by-6,x2:x+swatch,y2:by-6,stroke:col,"stroke-width":3.2}));
    const t=el("text",{x:x+swatch+swGap,y:by-2,"font-size":12,fill:"#101820","text-anchor":"start","font-weight":600});
    t.textContent=lab; svg.appendChild(t);
    x+=widths[i]+itemGap;
  });
})();

// ---- wind vector: inside the frame, in the right band, at 072 clockface -----
(function(){
  const srcBrg=72*Math.PI/180;                     // wind FROM 072 (ENE)
  const ux=Math.sin(srcBrg), uy=-Math.cos(srcBrg);  // outward (source) dir, screen up=north
  const inx=-ux, iny=-uy;                           // inward (down-wind) dir
  // clockface height: where bearing 072 exits the DATA area right edge
  const pcx=data.x+data.w/2, pcy=data.y+data.h/2;
  const tt=(data.x+data.w-pcx)/ux;                  // reach the right edge
  const ey=pcy+uy*tt;                               // exit y on data edge
  // arrow lives wholly within the wind band (clear of traces); points inward (toward plot)
  const grey="#53565A";
  const Hx=bandL+14, Hy=ey;                          // head (inward end, at band's inner edge)
  const span=(bandR-16)-Hx;                          // horizontal room in band
  const Lw=span/(-inx);                              // length so tail sits near band's outer edge
  const Tx=Hx - inx*Lw, Ty=Hy - iny*Lw;             // tail (source end)
  svg.appendChild(el("line",{x1:Tx,y1:Ty,x2:Hx,y2:Hy,stroke:grey,"stroke-width":3}));
  const perpx=-iny, perpy=inx;
  svg.appendChild(el("polygon",{points:`${Hx+inx*2},${Hy+iny*2} ${Hx-inx*11+perpx*6},${Hy-iny*11+perpy*6} ${Hx-inx*11-perpx*6},${Hy-iny*11-perpy*6}`,fill:grey}));
  // labels, right-aligned inside the band, fully above the arrow (t3 clears the tail)
  const lx=bandR-8, ly=Math.min(Ty,Hy)-44;
  const t1=el("text",{x:lx,y:ly,"font-size":12.5,fill:grey,"font-weight":700,"text-anchor":"end","letter-spacing":"0.5"});
  t1.textContent="WIND"; svg.appendChild(t1);
  const t2=el("text",{x:lx,y:ly+16,"font-size":12,fill:grey,"text-anchor":"end"});
  t2.textContent="ENE 072\u00B0"; svg.appendChild(t2);
  const t3=el("text",{x:lx,y:ly+31,"font-size":12,fill:grey,"text-anchor":"end"});
  t3.textContent="8.3 km/h \u00B7 4.5 kn"; svg.appendChild(t3);
})();
</script>
